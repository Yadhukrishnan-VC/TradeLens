[alembic]
script_location = tradelite/alembic
sqlalchemy.url = sqlite:///tradelite.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = simple

[formatter_simple]
format = %(levelname)s %(name)s %(message)s

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = INFO
handlers = console

[logger_alembic]
level = INFO
handlers = console