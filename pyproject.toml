[project]
name = "tradelens"
version = "0.2.0"
description = "Simple, scalable trading platform: strategies as plugins, honest backtests, risk engine, paper/live brokers"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "psycopg[binary]>=3.1",   # PostgreSQL driver
  "yfinance>=0.2.40",      # free historical prices (Yahoo Finance)
  "scipy>=1.11",           # intel/model.py
  "scikit-learn>=1.3",     # intel/model.py (meta-model)
  "pyyaml>=6.0",           # scripts/backup.py
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "kiteconnect>=5.1"]
zerodha = ["kiteconnect>=5.1"]   # needed only for BROKER=zerodha (5.1+ supports market_protection)

[tool.setuptools.packages.find]
include = ["tradelens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
