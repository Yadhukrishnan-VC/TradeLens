[project]
name = "tradelens"
version = "0.2.0"
description = "Simple, scalable trading platform: strategies as plugins, honest backtests, risk engine, paper/live brokers"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "psycopg[binary]>=3.1",   # PostgreSQL driver
  "yfinance>=0.2.40",      # free historical prices (Yahoo Finance)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["tradelens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
