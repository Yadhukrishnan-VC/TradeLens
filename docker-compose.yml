services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tradelens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradelens -d tradelens"]
      interval: 5s
      timeout: 5s
      retries: 10
    # not published to the host: only the app container can reach the database

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env                  # every setting in .env reaches the container (nothing to keep in sync here)
    environment:                    # only what must differ from .env inside Docker
      DATABASE_URL: postgresql://tradelens:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}@db:5432/tradelens
      DATA_SOURCE: db
      DATA_DIR: /app/data
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (python -m tradelens token)}
    volumes:
      - ./data:/app/data:ro          # optional: SYMBOL.csv files for `import-csv`
    # Token auth protects the API, but keep it bound to this machine; put HTTPS in front before exposing it.
    ports:
      - "127.0.0.1:8000:8000"
    # create/upgrade the schema, then serve (this REPLACES the image's default CMD, so it must start the server)
    command: ["sh", "-c", "python -m tradelens migrate && exec uvicorn tradelens.api.main:create_app --factory --host 0.0.0.0 --port 8000"]

  # Runs the daily job after market close on trading days. Same image, same database, no published port.
  # Starts after the app is healthy so only one container creates/upgrades the schema.
  worker:
    build: .
    command: ["python", "-m", "tradelens", "worker"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file: .env                  # every setting in .env reaches the container (nothing to keep in sync here)
    environment:                    # only what must differ from .env inside Docker
      DATABASE_URL: postgresql://tradelens:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}@db:5432/tradelens
      DATA_SOURCE: db
      DATA_DIR: /app/data
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (python -m tradelens token)}
    volumes:
      - ./data:/app/data:ro          # put holidays.txt here and set HOLIDAYS_FILE=/app/data/holidays.txt

volumes:
  pgdata:
