services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tradelens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradelens -d tradelens"]
      interval: 5s
      timeout: 5s
      retries: 10
    # not published to the host: only the app container can reach the database

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tradelens:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}@db:5432/tradelens
      DATA_SOURCE: db
      DATA_DIR: /app/data
      TRADELENS_DEMO: ${TRADELENS_DEMO:-0}
      TRADELENS_MODE: ${TRADELENS_MODE:-semi_auto}
      STARTING_CAPITAL: ${STARTING_CAPITAL:-100000}
      BROKER: ${BROKER:-paper}
      PAPER_FILL: ${PAPER_FILL:-next_open}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:-}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET:-}
      ZERODHA_DRY_RUN: ${ZERODHA_DRY_RUN:-1}
      LIVE_MAX_ORDER_VALUE: ${LIVE_MAX_ORDER_VALUE:-10000}
      LIVE_MAX_DAILY_VALUE: ${LIVE_MAX_DAILY_VALUE:-25000}
      LIVE_ALLOW_AUTO: ${LIVE_ALLOW_AUTO:-0}
      EVENTS_FILE: ${EVENTS_FILE:-}
      FILTERS_ENFORCED: ${FILTERS_ENFORCED:-0}
      LIVE_SCREENER: ${LIVE_SCREENER:-1}
      GATE_MODE: ${GATE_MODE:-auto}
      BENCHMARK_SYMBOL: ${BENCHMARK_SYMBOL:-NIFTYBEES}
      ENFORCE_REGIME: ${ENFORCE_REGIME:-0}
      EVENT_WINDOW_DAYS: ${EVENT_WINDOW_DAYS:-2}
      VALIDATION_MAX_AGE_DAYS: ${VALIDATION_MAX_AGE_DAYS:-45}
      LIVE_INTERVAL_SECONDS: ${LIVE_INTERVAL_SECONDS:-300}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (python -m tradelens token)}
    volumes:
      - ./data:/app/data:ro          # optional: SYMBOL.csv files for `import-csv`
    # Token auth protects the API, but keep it bound to this machine; put HTTPS in front before exposing it.
    ports:
      - "127.0.0.1:8000:8000"
    # create/upgrade the schema, then serve (this REPLACES the image's default CMD, so it must start the server)
    command: ["sh", "-c", "python -m tradelens migrate && exec uvicorn tradelens.api.main:create_app --factory --host 0.0.0.0 --port 8000"]

  # Runs the daily job after market close on trading days. Same image, same database, no published port.
  # Starts after the app is healthy so only one container creates/upgrades the schema.
  worker:
    build: .
    command: ["python", "-m", "tradelens", "worker"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tradelens:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}@db:5432/tradelens
      DATA_SOURCE: db
      DATA_DIR: /app/data
      TRADELENS_DEMO: ${TRADELENS_DEMO:-0}
      TRADELENS_MODE: ${TRADELENS_MODE:-semi_auto}
      STARTING_CAPITAL: ${STARTING_CAPITAL:-100000}
      BROKER: ${BROKER:-paper}
      PAPER_FILL: ${PAPER_FILL:-next_open}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY:-}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET:-}
      ZERODHA_DRY_RUN: ${ZERODHA_DRY_RUN:-1}
      LIVE_MAX_ORDER_VALUE: ${LIVE_MAX_ORDER_VALUE:-10000}
      LIVE_MAX_DAILY_VALUE: ${LIVE_MAX_DAILY_VALUE:-25000}
      LIVE_ALLOW_AUTO: ${LIVE_ALLOW_AUTO:-0}
      EVENTS_FILE: ${EVENTS_FILE:-}
      FILTERS_ENFORCED: ${FILTERS_ENFORCED:-0}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (python -m tradelens token)}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
      DAILY_RUN_AT: ${DAILY_RUN_AT:-16:30}
      HOLIDAYS_FILE: ${HOLIDAYS_FILE:-}
      REFRESH_YEARS: ${REFRESH_YEARS:-5}
      GATE_MODE: ${GATE_MODE:-auto}
      BENCHMARK_SYMBOL: ${BENCHMARK_SYMBOL:-NIFTYBEES}
      ENFORCE_REGIME: ${ENFORCE_REGIME:-0}
      EVENT_WINDOW_DAYS: ${EVENT_WINDOW_DAYS:-2}
      VALIDATION_MAX_AGE_DAYS: ${VALIDATION_MAX_AGE_DAYS:-45}
    volumes:
      - ./data:/app/data:ro          # put holidays.txt here and set HOLIDAYS_FILE=/app/data/holidays.txt

volumes:
  pgdata:
